<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarifas PRO v2.0</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6b3a">
<link rel="icon" href="icon-fjp.svg" type="image/svg+xml">
<style>
body{font-family:Arial,sans-serif;background:#ececec;margin:0;padding:20px}
.container{max-width:1100px;margin:auto}
.header{background:#0f7b36;color:#fff;padding:18px;border-radius:12px;text-align:center;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.card h3{margin:0 0 10px;color:#0f7b36}
label{font-weight:bold;display:block;margin-top:10px}
input{width:100%;padding:10px;font-size:16px;border:2px solid #16a34a;border-radius:8px;box-sizing:border-box}
button{width:100%;margin-top:15px;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#1d4ed8}
.table{width:100%;border-collapse:collapse;margin-top:15px}
.table th{background:#16a34a;color:#fff;padding:10px}
.table td{padding:10px;border:1px solid #bbb;text-align:center;font-weight:bold}
.green{background:#16a34a;color:#fff}
.margin-green{background:#22c55e;color:#fff}
.margin-yellow{background:#facc15;color:#000}
.margin-red{background:#ef4444;color:#fff}
.footer{text-align:center;color:#666;margin-top:20px;font-size:13px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Calculadora de Tarifas PRO</h1>
<p>Versión 2.0 · Murcia</p>
</div>
<div class="grid">
<div class="card">
<h3>Ruta</h3>
<label>Origen</label><input id="origen" value="Lorca">
<label>Destino</label><input id="destino" value="Cartagena">
<button onclick="verRuta()">📍 Ver Ruta en Google Maps</button>
<label>Kilómetros al destino</label><input id="km" type="number" value="87" oninput="calcular()">
<label>Ida y vuelta</label><input id="kmiv" disabled>
</div>
<div class="card">
<h3>Datos de Costos</h3>
<label>Precio gasoil (€/L)</label><input id="gasoil" type="number" step="0.01" value="1.80" oninput="calcular()">
<label>Conductor Autobús / Microbús (€)</label><input id="choferBus" type="number" value="70" oninput="calcular()">
<label>Conductor Furgoneta (€)</label><input id="choferFurgo" type="number" value="14" oninput="calcular()">
</div>
</div>
<div class="card" style="margin-top:20px">
<h3>Resultados</h3>
<table class="table">
<tr><th>Vehículo</th><th>Precio Venta (€)</th><th>Costo Operativo (€)</th><th>Margen (%)</th></tr>
<tr><td class="green">Autobús 55</td><td id="pv55"></td><td id="co55"></td><td id="mg55"></td></tr>
<tr><td class="green">Microbús 35</td><td id="pv35"></td><td id="co35"></td><td id="mg35"></td></tr>
<tr><td class="green">Microbús 25</td><td id="pv25"></td><td id="co25"></td><td id="mg25"></td></tr>
<tr><td class="green">Furgoneta</td><td id="pvF"></td><td id="coF"></td><td id="mgF"></td></tr>
</table>
</div>
<div class="footer">FJP ETT Murcia · Tarifas PRO v2.0</div>
</div>
<script>
function euro(v){return v.toFixed(1).replace('.',',')+' €'}
function margenClase(m){if(m<30)return'margin-red';if(m<40)return'margin-yellow';return'margin-green'}
function pintarMargen(id,m){let c=document.getElementById(id);c.innerHTML=m.toFixed(0)+'%';c.className=margenClase(m)}
function calcular(){
const km=Number(document.getElementById('km').value)||0;
const kmIV=km*2;
document.getElementById('kmiv').value=kmIV+' km';
const gasoil=Number(document.getElementById('gasoil').value)||0;
const choferBus=Number(document.getElementById('choferBus').value)||0;
const choferFurgo=Number(document.getElementById('choferFurgo').value)||0;
const pv35=0.95*km*99.92*Math.pow(km,-0.735);
const pv55=pv35*1.15;
const pv25=pv35*0.93;
const pvF=pv35*0.50;
const co55=kmIV*0.30*gasoil+kmIV*0.10+30+choferBus;
const co35=kmIV*0.22*gasoil+kmIV*0.07+25+choferBus;
const co25=kmIV*0.16*gasoil+kmIV*0.06+25+choferBus;
const coF=kmIV*0.10*gasoil+kmIV*0.04+15+choferFurgo;
document.getElementById('pv55').innerHTML=euro(pv55);
document.getElementById('pv35').innerHTML=euro(pv35);
document.getElementById('pv25').innerHTML=euro(pv25);
document.getElementById('pvF').innerHTML=euro(pvF);
document.getElementById('co55').innerHTML=euro(co55);
document.getElementById('co35').innerHTML=euro(co35);
document.getElementById('co25').innerHTML=euro(co25);
document.getElementById('coF').innerHTML=euro(coF);
pintarMargen('mg55',(pv55-co55)/pv55*100);
pintarMargen('mg35',(pv35-co35)/pv35*100);
pintarMargen('mg25',(pv25-co25)/pv25*100);
pintarMargen('mgF',(pvF-coF)/pvF*100);
}
function verRuta(){
const o=encodeURIComponent(document.getElementById('origen').value);
const d=encodeURIComponent(document.getElementById('destino').value);
window.open('https://www.google.com/maps/dir/'+o+'/'+d,'_blank');
}
calcular();
</script>
  <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => {
                console.log("FJP ETT Tarifas PRO instalada correctamente");
            })
            .catch(error => {
                console.error("Error al registrar la PWA:", error);
            });
    });
}
</script>
</body>
</html>
