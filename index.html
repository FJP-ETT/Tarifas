<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FJP ETT Tarifas PRO v1.0</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#F4FFF6;
      color:#154734;
    }

    header{
      background:#0F7A3B;
      color:white;
      padding:20px;
      text-align:center;
      box-shadow:0 3px 8px rgba(0,0,0,.2);
    }

    .logo{
      width:90px;
      height:90px;
      border-radius:50%;
      background:white;
      margin:0 auto 15px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#0F7A3B;
      font-size:34px;
      font-weight:bold;
      border:4px solid #6BCB77;
    }

    .version{
      font-size:14px;
      opacity:.9;
      margin-top:5px;
    }

    .container{
      max-width:700px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:white;
      padding:20px;
      margin-bottom:20px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,.08);
      border-left:6px solid #18A558;
    }

    h2{
      margin-bottom:15px;
      color:#0F7A3B;
    }

    label{
      font-weight:bold;
      margin-top:10px;
      display:block;
    }

    input, select{
      width:100%;
      padding:12px;
      margin-top:6px;
      margin-bottom:15px;
      border-radius:10px;
      border:2px solid #CDEFD8;
      font-size:16px;
    }

    button{
      width:100%;
      background:#18A558;
      color:white;
      border:none;
      padding:15px;
      border-radius:12px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#0F7A3B;
    }

    .resultado{
      background:#E8F8EC;
      padding:15px;
      border-radius:12px;
      margin-top:15px;
    }

    .precio{
      display:flex;
      justify-content:space-between;
      padding:8px 0;
      font-size:18px;
    }

    footer{
      text-align:center;
      color:#0F7A3B;
      padding:20px;
      font-size:14px;
    }
  </style>
</head>

<body>

<header>

  <div class="logo">FJP</div>

  <h1>FJP ETT Murcia</h1>
  <p>Sistema de Cálculo de Tarifas</p>

  <div class="version">
    Versión 1.0 • Cost Controller Carlos Suárez
  </div>

  <div id="fecha"></div>

</header>

<div class="container">

  <div class="card">
    <h2>🚌 Calculadora por Kilómetros</h2>

    <label>Kilómetros (ida)</label>
    <input type="number" id="km" placeholder="Ejemplo: 107">

    <label>Factor (%)</label>
    <input type="number" id="factor" value="100">

    <button onclick="calcular()">Calcular tarifa</button>

    <div class="resultado">

      <div class="precio">
        <strong>Microbús 25</strong>
        <span id="m25">0.00 €</span>
      </div>

      <div class="precio">
        <strong>Microbús 35</strong>
        <span id="m35">0.00 €</span>
      </div>

      <div class="precio">
        <strong>Autobús 55</strong>
        <span id="b55">0.00 €</span>
      </div>

    </div>

  </div>

</div>

<footer>
  © 2026 FJP ETT Murcia | Proyecto Tarifas PRO
</footer>

<script>

const hoy = new Date();

const fecha = hoy.toLocaleDateString('es-ES',{
  day:'2-digit',
  month:'long',
  year:'numeric'
});

document.getElementById('fecha').innerHTML = fecha;

function calcular(){

  let km = Number(document.getElementById('km').value);
  let factor = Number(document.getElementById('factor').value)/100;

  if(km<=0){
    alert('Ingrese los kilómetros');
    return;
  }

  let micro35 = (99.92*Math.pow(km,-0.735))*km;
  let bus55 = micro35*1.15;
  let micro25 = micro35*0.93;

  micro35*=factor;
  bus55*=factor;
  micro25*=factor;

  document.getElementById('m35').innerHTML = micro35.toFixed(2)+' €';
  document.getElementById('b55').innerHTML = bus55.toFixed(2)+' €';
  document.getElementById('m25').innerHTML = micro25.toFixed(2)+' €';
}

</script>

</body>
</html>
